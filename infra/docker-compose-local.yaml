version: '3.8'

services:
  db-local:
    image: postgres:15
    container_name: e108-postgres-local
    restart: always
    env_file:
      - .env          # ← 이거 추가
    environment:
      POSTGRES_DB: e108_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - e108-local-network

  redis-local:
    image: redis:alpine
    container_name: e108-redis-local
    restart: always
    ports:
      - "6379:6379"
    networks:
      - e108-local-network

networks:
  e108-local-network:
    driver: bridge