server:
  servlet:
    context-path: /api/v1

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}  # 기본값 dev, 서버에서 prod로 변경

  application:
    name: be

  # schema.sql 실행 활성화 (외부 DB는 기본 never → always로 명시)
  # 실행 순서: schema.sql(PostGIS 확장) → Hibernate DDL(테이블 생성) → ApplicationReadyEvent(GiST 인덱스)
  sql:
    init:
      mode: always

  # 파일 업로드 크기 설정
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  # 공통 JPA 설정
  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 100

# JWT 설정
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

# 외부 API 설정
api:
  weather:
    service-key: ${WEATHER_SERVICE_KEY}
  air-quality:
    service-key: ${AIR_QUALITY_SERVICE_KEY}
  gms:
    api-key: ${GMS_KEY}
    model: gpt-5-mini
    base-url: https://gms.ssafy.io/gmsapi/api.openai.com/v1

# S3 설정
aws:
  s3:
    bucket: ssafy-e108-uploads
    region: ap-northeast-2
  credentials:
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}
