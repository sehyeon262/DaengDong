server:
  servlet:
    context-path: /api/v1

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}  # 기본값 dev, 서버에서 prod로 변경

  application:
    name: be

  # schema.sql 실행 활성화 (외부 DB는 기본 never → always로 명시)
  # 실행 순서: schema.sql(PostGIS 확장) → Hibernate DDL(테이블 생성) → ApplicationReadyEvent(GiST 인덱스)
  sql:
    init:
      mode: always

  # 파일 업로드 크기 설정
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 100MB

  # 공통 JPA 설정
  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 100

# JWT 설정
jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000  # 1주일 (7 * 24 * 60 * 60 * 1000)

# 외부 API 설정
api:
  weather:
    service-key: ${WEATHER_SERVICE_KEY}
  air-quality:
    service-key: ${AIR_QUALITY_SERVICE_KEY}
  gms:
    api-key: ${GMS_KEY}
    model: gpt-5-mini
    base-url: https://gms.ssafy.io/gmsapi/api.openai.com/v1
  tmap:
    app-key: ${TMAP_APP_KEY:}
    base-url: https://apis.openapi.sk.com/tmap/routes/pedestrian
    connect-timeout: 5
    read-timeout: 30
    enabled: ${TMAP_ENABLED:true}

# 강아지 감정 분석 모델 설정
emotion:
  model-path: ${EMOTION_MODEL_PATH:models/dog.onnx}
  confidence-threshold: 0.5  # Vision API가 강아지 탐지를 담당하므로 감정 분류 threshold는 낮게 유지

# Google Cloud Vision API 설정 (API 키 방식)
google:
  vision:
    api-key: ${GOOGLE_VISION_API_KEY}

# S3 설정
aws:
  s3:
    bucket: ssafy-e108-uploads-216203894753-ap-northeast-2-an
    region: ap-northeast-2
  credentials:
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}
