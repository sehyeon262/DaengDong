<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>채팅 테스트</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f0f0f0; padding: 20px; }
        h2 { margin-bottom: 16px; }
        .container { max-width: 700px; margin: auto; }
        .card {
            background: white;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
        input[type=text], textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 10px;
        }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 6px;
        }
        .btn-primary { background: #4f8ef7; color: white; }
        .btn-danger  { background: #e74c3c; color: white; }
        .btn-success { background: #2ecc71; color: white; }
        .btn-gray    { background: #aaa; color: white; }
        #status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 13px;
            background: #eee;
            color: #555;
            margin-left: 8px;
        }
        #status.connected    { background: #d4edda; color: #155724; }
        #status.disconnected { background: #f8d7da; color: #721c24; }
        #chat-box {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            background: #fafafa;
            margin-bottom: 10px;
        }
        .msg { margin-bottom: 8px; font-size: 14px; }
        .msg .meta { font-size: 11px; color: #999; margin-bottom: 2px; }
        .msg .bubble {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 12px;
            max-width: 80%;
            word-break: break-all;
        }
        .msg.mine .bubble   { background: #4f8ef7; color: white; }
        .msg.other .bubble  { background: #e0e0e0; color: #333; }
        .msg.system .bubble { background: #fff3cd; color: #856404; font-size: 12px; }
        .send-row { display: flex; gap: 8px; }
        .send-row input { margin-bottom: 0; flex: 1; }
        .history-box {
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 13px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>💬 채팅 테스트</h2>

    <!-- 설정 -->
    <div class="card">
        <h3 style="margin-bottom:12px;">① 연결 설정</h3>
        <label>JWT 토큰 (Bearer 제외)</label>
        <input type="text" id="token" placeholder="eyJhbGciOiJIUzI1NiJ9..." />
        <label>채팅방 ID</label>
        <input type="text" id="chatRoomId" placeholder="1" value="1" />
        <label>내 Member ID (메시지 구분용)</label>
        <input type="text" id="myMemberId" placeholder="10" />
        <div style="display:flex; align-items:center;">
            <button class="btn-primary" onclick="connect()">연결</button>
            <button class="btn-danger"  onclick="disconnect()">연결 해제</button>
            <span id="status" class="disconnected">연결 안 됨</span>
        </div>
    </div>

    <!-- 이전 메시지 조회 -->
    <div class="card">
        <h3 style="margin-bottom:12px;">② 이전 메시지 조회 (REST)</h3>
        <button class="btn-gray" onclick="loadHistory()">GET /api/v1/chat/rooms/{chatRoomId}</button>
        <div id="history-box" class="history-box" style="margin-top:10px;">조회 결과가 여기에 표시됩니다.</div>
    </div>

    <!-- 실시간 채팅 -->
    <div class="card">
        <h3 style="margin-bottom:12px;">③ 실시간 채팅 (WebSocket)</h3>
        <div id="chat-box"></div>
        <div class="send-row">
            <input type="text" id="msg-input" placeholder="메시지 입력..." onkeydown="if(event.key==='Enter') sendMessage()" />
            <button class="btn-success" onclick="sendMessage()">전송</button>
        </div>
    </div>
</div>

<script>
    let stompClient = null;

    function connect() {
        const token      = document.getElementById('token').value.trim();
        const chatRoomId = document.getElementById('chatRoomId').value.trim();
        if (!token || !chatRoomId) {
            alert('JWT 토큰과 채팅방 ID를 입력해주세요.');
            return;
        }

        const socket = new SockJS('/api/v1/ws');
        stompClient  = Stomp.over(socket);
        stompClient.debug = null; // 콘솔 로그 숨김

        stompClient.connect(
            { 'Authorization': 'Bearer ' + token },
            function () {
                setStatus(true);
                appendSystem('✅ 연결 성공! /topic/chat/' + chatRoomId + ' 구독 중...');

                stompClient.subscribe('/topic/chat/' + chatRoomId, function (msg) {
                    const data = JSON.parse(msg.body);
                    const myId = document.getElementById('myMemberId').value.trim();
                    const isMine = String(data.senderId) === String(myId);
                    appendMessage(data, isMine);
                });
            },
            function (error) {
                setStatus(false);
                appendSystem('❌ 연결 실패: ' + error);
            }
        );
    }

    function disconnect() {
        if (stompClient) {
            stompClient.disconnect();
            stompClient = null;
        }
        setStatus(false);
        appendSystem('🔌 연결 해제됨');
    }

    function sendMessage() {
        const chatRoomId = document.getElementById('chatRoomId').value.trim();
        const content    = document.getElementById('msg-input').value.trim();
        if (!stompClient || !stompClient.connected) {
            alert('먼저 WebSocket 연결을 해주세요.');
            return;
        }
        if (!content) return;

        stompClient.send(
            '/app/chat/' + chatRoomId,
            {},
            JSON.stringify({ content: content })
        );
        document.getElementById('msg-input').value = '';
    }

    async function loadHistory() {
        const token      = document.getElementById('token').value.trim();
        const chatRoomId = document.getElementById('chatRoomId').value.trim();
        const box        = document.getElementById('history-box');
        if (!token || !chatRoomId) {
            alert('JWT 토큰과 채팅방 ID를 입력해주세요.');
            return;
        }
        try {
            const res  = await fetch('/api/v1/chat/rooms/' + chatRoomId, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const json = await res.json();
            box.textContent = JSON.stringify(json, null, 2);
        } catch (e) {
            box.textContent = '오류: ' + e.message;
        }
    }

    function appendMessage(data, isMine) {
        const chatBox = document.getElementById('chat-box');
        const div     = document.createElement('div');
        div.className = 'msg ' + (isMine ? 'mine' : 'other');
        div.style.textAlign = isMine ? 'right' : 'left';
        div.innerHTML = `
            <div class="meta">sender: ${data.senderId} · ${formatTime(data.sentAt)}</div>
            <span class="bubble">${escapeHtml(data.content)}</span>
        `;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendSystem(text) {
        const chatBox = document.getElementById('chat-box');
        const div     = document.createElement('div');
        div.className = 'msg system';
        div.style.textAlign = 'center';
        div.innerHTML = `<span class="bubble">${text}</span>`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function setStatus(connected) {
        const el = document.getElementById('status');
        el.textContent  = connected ? '연결됨' : '연결 안 됨';
        el.className    = connected ? 'connected' : 'disconnected';
    }

    function formatTime(dateStr) {
        if (!dateStr) return '';
        return new Date(dateStr).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function escapeHtml(str) {
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
</script>
</body>
</html>
