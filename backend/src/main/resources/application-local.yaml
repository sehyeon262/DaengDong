spring:

  config:
    import:
      - optional:file:../infra/.env[.properties]
  # 개발용 DB 설정
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/e108_db?sslmode=disable}
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: "SET client_encoding TO 'UTF8'"

  # Redis 설정
  data:
    redis:
      host: localhost
      port: 6379

  # local 전용 초기 데이터 로딩
  sql:
    init:
      encoding: UTF-8
      data-locations:
        - classpath:sql/users.sql
        - classpath:sql/init_places.sql
        - classpath:sql/walk_records.sql
        - classpath:sql/badges.sql
        - classpath:sql/demo_personas.sql
      continue-on-error: true

  # 개발용 JPA 설정
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 데모 모드: 산책 종료 시 아래 사진을 자동으로 주입 + 감정 하드코딩
demo:
  enabled: true
  photo-urls: []
    # DemoPhotoInitializer가 서버 시작 시 S3 업로드 후 자동 세팅
  emotion-overrides:
    dog1.png: happy
    dog2.jpg: relaxed

aws:
  s3:
    prefix: local