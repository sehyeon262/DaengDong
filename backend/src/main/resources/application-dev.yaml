spring:
  # Redis 설정
  data:
    redis:
      host: localhost
      port: 6379

  # 개발용 DB 설정
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/e108_db}
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # 초기 데이터 로딩
  sql:
    init:
      encoding: UTF-8
      data-locations:
        - classpath:sql/badges.sql
      continue-on-error: true

  # 개발용 JPA 설정
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


aws:
  s3:
    prefix: dev