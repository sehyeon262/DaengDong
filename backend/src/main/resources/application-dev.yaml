spring:
  # Redis 설정
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis-dev}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  # 개발용 DB 설정
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/e108_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # 초기 데이터 로딩
  sql:
    init:
      encoding: UTF-8
      data-locations:
        - classpath:sql/users.sql
        - classpath:sql/init_places.sql
        - classpath:sql/walk_records.sql
        - classpath:sql/badges.sql
        - classpath:sql/demo_personas.sql
      continue-on-error: true

  # 개발용 JPA 설정
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true


# 데모 모드: 시연용 사진 자동 주입 + 감정 하드코딩
demo:
  enabled: true
  photo-urls: []
  emotion-overrides:
    dog1.png: happy
    dog2.jpg: relaxed

aws:
  s3:
    prefix: dev