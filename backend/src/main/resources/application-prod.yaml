spring:
  # 운영용 DB 설정 (환경변수로 주입)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # 운영용 JPA 설정
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false


# 데모 모드: 시연용 사진 자동 주입 + 감정 하드코딩
demo:
  enabled: true
  photo-urls: []
  emotion-overrides:
    dog1.png: happy
    dog2.jpg: relaxed

aws:
  s3:
    prefix: prod